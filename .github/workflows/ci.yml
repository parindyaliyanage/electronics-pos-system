name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, development]

env:
  # prisma generate only needs a syntactically valid URL, not a reachable DB.
  DATABASE_URL: postgresql://smartretail:smartretail@localhost:5432/smartretail?schema=public

jobs:
  lint-typecheck-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Type-check & build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test

      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=high || true

  docker-build:
    name: Docker build
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          load: true
          tags: smartretail/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: false
          load: true
          tags: smartretail/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build temporal-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          load: true
          tags: smartretail/temporal-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Publish to GHCR only from main — feature branches just validate the build above.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend

      - name: Push frontend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.PUBLIC_API_URL || 'https://api.smartretail.example.com' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend

      - name: Push temporal-worker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/temporal-worker:latest
            ghcr.io/${{ github.repository }}/temporal-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker

  deploy:
    name: Deploy to Kubernetes
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cluster exists yet — this job is prep only. Once one does, add the
      # KUBE_CONFIG (base64 kubeconfig), GHCR_PAT (a PAT with read:packages,
      # since GITHUB_TOKEN expires and can't be used as a long-lived pull
      # secret), DB_PASSWORD, JWT_SECRET, S3_ACCESS_KEY and S3_SECRET_KEY repo
      # secrets, and set the PUBLIC_API_URL repo variable to your real API
      # hostname. Until KUBE_CONFIG is set, every step below is skipped.
      - name: Check cluster access is configured
        id: check
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG secret not set — skipping deploy. See comment above this step for the secrets a real cluster needs."
          fi

      - uses: azure/setup-kubectl@v4
        if: steps.check.outputs.configured == 'true'

      - uses: imranismail/setup-kustomize@v2
        if: steps.check.outputs.configured == 'true'

      - name: Write kubeconfig
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Ensure namespace exists
        if: steps.check.outputs.configured == 'true'
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: Sync GHCR image pull secret
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            -n smartretail \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secrets
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl create secret generic smartretail-secrets \
            -n smartretail \
            --from-literal=DATABASE_URL="postgresql://smartretail:${{ secrets.DB_PASSWORD }}@postgres:5432/smartretail?schema=public" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=MINIO_ROOT_USER="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=MINIO_ROOT_PASSWORD="${{ secrets.S3_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tags
        if: steps.check.outputs.configured == 'true'
        working-directory: infra/k8s
        run: |
          kustomize edit set image \
            smartretail/backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            smartretail/frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            smartretail/temporal-worker=ghcr.io/${{ github.repository }}/temporal-worker:${{ github.sha }}

      - name: Apply manifests
        if: steps.check.outputs.configured == 'true'
        run: kubectl apply -k infra/k8s

      - name: Wait for rollout
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/backend -n smartretail --timeout=180s
          kubectl rollout status deployment/frontend -n smartretail --timeout=180s
          kubectl rollout status deployment/temporal-worker -n smartretail --timeout=180s
