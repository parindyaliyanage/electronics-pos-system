services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartretail
      POSTGRES_PASSWORD: smartretail
      POSTGRES_DB: smartretail
    ports:
      # Use 5433 on the host to avoid clashing with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=smartretail
      - POSTGRES_PWD=smartretail
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  # FR6 — Temporal Web UI: inspect installment workflows, timers and retries.
  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  # FR6 — local SMTP server that catches reminder emails (UI on :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://smartretail:smartretail@postgres:5432/smartretail?schema=public
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      # FR7 — dev MinIO credentials (match the minio service above).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-smartretail}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - temporal
      - minio

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  temporal-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://smartretail:smartretail@postgres:5432/smartretail?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - temporal
      - postgres
      - mailpit

volumes:
  postgres-data:
  minio-data:
