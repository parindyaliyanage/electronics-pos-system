# Serves the built React app. Any path that isn't a real file (e.g. /products
# after a refresh) falls back to index.html so React Router can handle it.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    # Vite puts a content hash in these file names, so they can be cached forever.
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # index.html must never be cached, or users keep an old version after a deploy.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
