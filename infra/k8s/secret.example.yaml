# Template only — documents the keys the workloads expect in the
# `smartretail-secrets` Secret. Do not apply this file as-is or commit real
# values here. The CD job (see .github/workflows/ci.yml) creates/updates the
# real Secret directly from GitHub Actions secrets on every deploy, so this
# file is intentionally excluded from kustomization.yaml.
#
# To bootstrap manually instead:
#   kubectl create secret generic smartretail-secrets -n smartretail \
#     --from-literal=DATABASE_URL=postgresql://smartretail:<db-password>@postgres:5432/smartretail?schema=public \
#     --from-literal=POSTGRES_PASSWORD=<db-password> \
#     --from-literal=JWT_SECRET=<random-long-string> \
#     --from-literal=S3_ACCESS_KEY=<minio-user> \
#     --from-literal=S3_SECRET_KEY=<minio-password> \
#     --from-literal=MINIO_ROOT_USER=<minio-user> \
#     --from-literal=MINIO_ROOT_PASSWORD=<minio-password>
apiVersion: v1
kind: Secret
metadata:
  name: smartretail-secrets
  namespace: smartretail
type: Opaque
stringData:
  DATABASE_URL: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  MINIO_ROOT_USER: CHANGE_ME
  MINIO_ROOT_PASSWORD: CHANGE_ME
