apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartretail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: backend
          image: smartretail/backend:placeholder
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smartretail-config
            - secretRef:
                name: smartretail-secrets
          # No HTTP routes exist yet (backend modules are still empty shells),
          # so probes check the port only. Switch to httpGet on a real health
          # endpoint once one exists.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smartretail
spec:
  selector:
    app: backend
  ports:
    - port: 3000
