apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartretail

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - temporal.yaml
  - backend.yaml
  - frontend.yaml
  - temporal-worker.yaml
  - ingress.yaml

# CD overrides these to the actual GHCR image + tag on every deploy via
# `kustomize edit set image` — see the deploy job in .github/workflows/ci.yml.
images:
  - name: smartretail/backend
    newName: smartretail/backend
    newTag: placeholder
  - name: smartretail/frontend
    newName: smartretail/frontend
    newTag: placeholder
  - name: smartretail/temporal-worker
    newName: smartretail/temporal-worker
    newTag: placeholder
