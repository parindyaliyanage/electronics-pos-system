apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: smartretail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z temporal 7233; do echo waiting for temporal; sleep 2; done
      containers:
        - name: temporal-worker
          image: smartretail/temporal-worker:placeholder
          envFrom:
            - configMapRef:
                name: smartretail-config
            - secretRef:
                name: smartretail-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
