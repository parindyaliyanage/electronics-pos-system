name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check & test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f infra/docker/Dockerfile.backend -t ghcr.io/${{ github.repository }}/backend:latest .
          docker build -f infra/docker/Dockerfile.frontend -t ghcr.io/${{ github.repository }}/frontend:latest .
          docker build -f infra/docker/Dockerfile.worker -t ghcr.io/${{ github.repository }}/temporal-worker:latest .
          docker push ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/frontend:latest
          docker push ghcr.io/${{ github.repository }}/temporal-worker:latest
